worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Basic rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=infer_limit:10m rate=10r/s;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 15G;
    client_body_timeout 3600s;
    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    server {
        listen 80;
        server_name localhost;

        # Route /api -> NestJS Platform
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            
            # Remove /api prefix before passing to backend
            rewrite ^/api/(.*)$ /$1 break;
            
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Route /infer -> Model services (Proxied through NestJS)
        location /infer/ {
            limit_req zone=infer_limit burst=20 nodelay;

            # Rewrite /infer/123 to /models/123/predict
            rewrite ^/infer/(.*)$ /models/$1/predict break;
            
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
