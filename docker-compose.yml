services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: always

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - MINIO_API_CORS_ALLOW_ORIGIN=*
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin); do echo 'Waiting for minio...'; sleep 3; done;
      /usr/bin/mc mb myminio/models --ignore-existing;
      /usr/bin/mc anonymous set public myminio/models;
      exit 0;
      "

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

  # Optional, fully self-contained Postgres for on-premise/air-gapped
  # deployments that don't want to manage a separate native Postgres
  # install. Disabled by default (matches the native-Postgres dev workflow
  # in RUNNING.md). Enable with `docker compose --profile onprem up -d` and
  # set DB_HOST=postgres in a root .env file. See docs/on-premise.md.
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    profiles: ["onprem"]
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-password}
      - POSTGRES_DB=${DB_NAME:-aidb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host-side port 5433 to avoid clashing with the native Postgres
      # service already bound to 5432 on the host. Internal container port
      # stays 5432 — other containers (e.g. backend, when DB_HOST=postgres)
      # reach it over the Docker network at postgres:5432 regardless of this
      # host mapping.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      # Defaults target the native Postgres service documented in RUNNING.md
      # (reachable from inside Docker via host.docker.internal). Set DB_HOST
      # in a root .env file to `postgres` (and enable the `onprem` profile) to
      # use the bundled Postgres container instead — see docs/on-premise.md.
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-aidb}
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
      - MODEL_SANDBOX_HARDENING_ENABLED=${MODEL_SANDBOX_HARDENING_ENABLED:-true}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - PUBLIC_API_URL=http://localhost:3000
      - OPENSEARCH_URL=http://opensearch:9200
      - GGUF_STORAGE_PATH=/usr/src/app/uploads/gguf-models
      - WEIGHTS_STORAGE_PATH=/usr/src/app/uploads/model-weights
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      - llm_models:/usr/src/app/uploads/gguf-models
      - model_weights:/usr/src/app/uploads/model-weights
      # B7: read-only access to the base-image Dockerfiles so
      # BaseImageWarmerService can `docker build` them from inside the
      # backend container (the Docker socket bind above talks to the host
      # daemon, but that daemon still needs a build context it can read —
      # since the daemon runs on the host, not in this container, the
      # *host* path is what actually matters for docker build's context;
      # this mount lets BaseImageWarmerService read the Dockerfile content
      # to detect/orchestrate but the daemon build itself resolves the
      # bind-mounted host path transparently under Docker Desktop's shared
      # filesystem).
      - ./docker/base-images:/usr/src/docker/base-images:ro
    depends_on:
      - redis
      - minio
      - otel-collector
      - opensearch
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run dev
    networks:
      - default
      - models
      # Model containers with allowEgress=false (the default, see F3) run on
      # this isolated network instead of `models` — the backend must be
      # attached here too, or it can't reach the container to run health
      # checks or proxy prediction requests, and the deployment will sit in
      # STARTING (container running, app never sees it become healthy).
      - models-isolated
    # Resource ceiling for the backend container itself (not the model-serving
    # containers it spawns via the Docker socket). Host has 10c/16 logical
    # cores; this leaves ample headroom for BUILD_QUEUE_CONCURRENCY / model
    # containers while preventing a runaway build from starving the host.
    # `mem_limit`/`cpus` (Compose v2 non-swarm syntax) are used instead of
    # `deploy.resources.limits`, which only applies under `docker stack deploy`.
    mem_limit: 4g
    cpus: 4

  llm-init:
    image: alpine:latest
    container_name: llm-init
    environment:
      - OFFLINE_MODE=${OFFLINE_MODE:-false}
    volumes:
      - llm_models:/models
    entrypoint: >
      /bin/sh -c "
      if [ -f /models/model.gguf ]; then
        echo 'Model already cached, skipping download.';
        exit 0;
      fi;
      if [ \"$$OFFLINE_MODE\" = \"true\" ]; then
        echo 'OFFLINE_MODE=true and no /models/model.gguf found. Place a GGUF file in the llm_models volume as model.gguf before starting the llm service. Skipping download.';
        exit 0;
      fi;
      apk add --no-cache wget &&
      echo 'Downloading Qwen2.5-0.5B model (this may take a few minutes)...' &&
      wget -O /models/model.gguf.tmp https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf &&
      mv /models/model.gguf.tmp /models/model.gguf &&
      echo 'Download complete.'
      "
    restart: "no"

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: llm
    ports:
      - "8080:8080"
    volumes:
      - llm_models:/models
    command: >
      -m /models/model.gguf
      --port 8080
      --host 0.0.0.0
      --ctx-size 8192
      -n 512
      --threads 4
    depends_on:
      llm-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mcp-server:
    build:
      context: ./services/mcp-server
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    environment:
      - MCP_PORT=3030
      - BACKEND_URL=http://backend:3000
      - BACKEND_API_PREFIX=/api/v1
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - MCP_IDENTITY_TTL_MS=30000
      - MCP_RATE_LIMIT_PER_MIN=120
    depends_on:
      - backend
    restart: always

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: always

  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: node-exporter
    volumes:
      - /:/host:ro
    command:
      - "--path.rootfs=/host"
    restart: always

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.89.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics from collector
    depends_on:
      - loki
    networks:
      - default
      - models
      - models-isolated
    restart: always

  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    user: "0"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    ports:
      - "3100:3100"
    restart: always

  prometheus:
    image: prom/prometheus:v2.47.2
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/observability/alert.rules.yml:/etc/prometheus/alert.rules.yml
      - ./docker/observability/targets.json:/etc/prometheus/targets.json
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cadvisor
      - node-exporter
    networks:
      - default
      - models
      - models-isolated
    restart: always

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./docker/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/observability/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana_data:/var/lib/grafana
    ports:
      - "3005:3000"
    depends_on:
      - prometheus
      - loki
    restart: always

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    user: "0" # Run as root to read docker socket and logs
    volumes:
      - ./docker/observability/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: always

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  loki_data:
  grafana_data:
  llm_models:
    name: ai-platform_llm_models
  model_weights:
    name: ai-platform_model_weights
  opensearch_data:

networks:
  default:
    name: ai-platform_default
  models:
    name: ai-platform_models
    driver: bridge
  models-isolated:
    name: ai-platform_models_isolated
    driver: bridge
    internal: true
